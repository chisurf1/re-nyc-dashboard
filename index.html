$('#sh').innerHTML=`<button class="x" onclick="cl()" aria-label="Close">×</button><h2>${esc(u.address)}</h2><div class="kv"><b>Price</b><span>${money(u.price)} · <span class="st ${u.status}">${esc(u.status)}</span></span><b>Hood</b><span>${esc(u.neighborhood)}</span><b>Type</b><span>${esc(u.beds)}</span><b>Terrace</b><span>${esc(u.terrace)}</span><b>PAT</b><span>${esc(u.pat)}</span><b>Maint.</b><span>${money(u.maint)}/mo</span><b>Sq ft</b><span>${u.sf||'unavailable'}</span><b>Open house</b><span>${esc(u.latest_oh)}</span><b>First seen</b><span>${u.first_seen}</span><b>Checked</b><span>${u.last_checked}</span>${u.douglas?`<b>Douglas</b><span>${esc(u.douglas)}</span>`:''}</div><h2>Notes</h2>${h.map(x=>`<div class="note"><b>${x.date}</b> ${money(x.price)} — ${esc(x.note)}</div>`).join('')||'<div class="note">—</div>'}<h2 style="margin-top:12px">Sources</h2>${u.sources.map(s=>`<div class="note"><a href="${esc(s)}" target="_blank" rel="noopener">${esc(s.replace(/^https?:\/\/(www\.)?/,'').split('/')[0])}</a></div>`).join('')}`;$('#dr').classList.add('on')}
function cl(){$('#dr').classList.remove('on')}
function rb(){const q=$('#q').value.toLowerCase(),f=$('#ft').value,s=$('#so').value;let L=U.filter(u=>(!q||JSON.stringify(u).toLowerCase().includes(q))&&(!f||(f=='studio'?/studio/i.test(u.beds):f=='1br'?/1BR/i.test(u.beds):u.status==f)));
L.sort((a,b)=>s=='nl'?(!a.listed)-(!b.listed)||(b.listed||'').localeCompare(a.listed||''):s=='pa'?a.price-b.price:s=='pd'?b.price-a.price:s=='mt'?(a.maint||1e9)-(b.maint||1e9):a.address.localeCompare(b.address));$('#cnt').textContent=L.length+' of '+U.length;
$('#lst').innerHTML=L.map(u=>`<div class="li"><div class="top"><div class="ad">${esc(u.address)}</div><div class="p">${money(u.price)}</div></div><div class="ty">${u.listed?(u.listed_basis=='listed'?'Listed ':'First seen ')+u.listed:'Listed: unavailable'} · ${esc(u.neighborhood)} · ${esc(u.beds)} · <span class="st ${u.status}">${esc(u.status)}</span></div><div class="note">${esc(u.terrace)} · ${esc(u.pat)} · maint ${money(u.maint)}${u.latest_oh&&u.latest_oh!='unavailable'?' · OH '+esc(u.latest_oh):''}</div><div class="acts"><button class="btn" onclick="op(${u.i})">Details</button>${u.sources&&u.sources[0]?`<a class="btn pr" href="${esc(u.sources[0])}" target="_blank" rel="noopener">Listing ↗</a>`:''}</div></div>`).join('')}
['#q','#ft','#so'].forEach(s=>$(s).oninput=rb);rb();
(function(){const pts=U.filter(u=>u.sf),miss=U.filter(u=>!u.sf);$('#cnote').textContent=(pts.length?'Each dot is a shortlist unit ($ vs sq ft); tap for details. ':'')+(miss.length?`Sq ft unavailable for ${miss.length} unit(s), left off the chart: ${miss.map(u=>u.address).join('; ')}.`:'');
if(!pts.length){$('#chart').innerHTML='<div class="note">No shortlist unit has a sourced square footage yet.</div>';return}
const W=360,H=240,p={l:46,r:10,t:10,b:30},xM=Math.max(...pts.map(b=>b.sf))*1.1,yM=8e5,x=v=>p.l+v/xM*(W-p.l-p.r),y=v=>H-p.b-v/yM*(H-p.t-p.b);let g='';
for(let i=0;i<=4;i++){const v=yM*i/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="#2c3360"/><text x="${p.l-4}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#9aa0bd">$${v/1e3}k</text>`}
pts.forEach(b=>g+=`<circle cx="${x(b.sf)}" cy="${y(b.price)}" r="9" fill="#5b8cff" onclick="op(${b.i})"/>`);$('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>`})();
$('#ev').innerHTML=D.events.slice(0,15).map(e=>`<div class="note"><b>${e.date}</b> · ${esc(e.type)} · ${esc(e.address||'')}<br>${esc(e.detail||e.note||'')}</div>`).join('')||'<div class="note">—</div>';
$('#nw').innerHTML=D.news.map((n,i)=>`<details ${i==0?'open':''}><summary><b>${n.date}</b></summary><div class="note">${esc(n.text)}</div></details>`).join('');
$('#mk').innerHTML='<table><tr><th>Date</th><th>MOI</th><th>Bias</th><th>Basis</th></tr>'+D.market.slice().reverse().map(m=>`<tr><td>${m.date.slice(5)}</td><td>${m.months_inventory??'—'}</td><td>${esc(m.bias||m.market_bias||'')}</td><td style="font-size:11.5px;color:#9aa0bd;word-break:break-word">${esc(m.mi_text||'')}</td></tr>`).join('')+'</table>';
$('#cav').textContent=D.caveat;
$('#rj').innerHTML=D.rejected.slice(0,12).map(r=>`<div class="note"><b>${r.date}</b> ${esc(r.address)} — ${esc(r.reason)}</div>`).join('');
</script></body></html>
